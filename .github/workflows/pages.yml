name: Check and deploy RISC-V Assembly Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify bundled editor
        run: npm run build:editor && git diff --exit-code -- site/vendor/editor/ asset-manifest.json
      - run: npm run check:assets
      - name: Verify generated course pages
        run: npm run build:course && git diff --exit-code -- site/index.html site/lessons/ site/using-the-workbench/ site/course/catalog.json
      - run: npm test
      - name: Install independent RISC-V execution checker
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Check every lesson and challenge corpus
        run: npm run test:course
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: .artifacts/
          include-hidden-files: true
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
